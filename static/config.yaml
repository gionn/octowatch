# OctoWatch Configuration
# Organize repositories into groups for better organization

repository_groups:
  - name: "Alfresco DevOps"
    slug: "alfresco-devops"
    description: "Infrastructure and deployment tools for Alfresco"
    enabled: true
    repositories:
      - name: "alfresco-build-tools"
        owner: "Alfresco"
        url: "https://github.com/Alfresco/alfresco-build-tools"
        branch: "master"
        enabled: true

      - name: "acs-deployment"
        owner: "Alfresco"
        url: "https://github.com/Alfresco/acs-deployment"
        branch: "master"
        enabled: true

      - name: "alfresco-ansible-deployment"
        owner: "Alfresco"
        url: "https://github.com/Alfresco/alfresco-ansible-deployment"
        branch: "master"
        enabled: true

      - name: "alfresco-cloud-infrastructure"
        owner: "Alfresco"
        url: "https://github.com/Alfresco/alfresco-cloud-infrastructure"
        branch: "main"
        enabled: true

  - name: "Alfresco Docker"
    slug: "alfresco-docker"
    description: "Docker base images and container tools"
    enabled: true
    repositories:
      - name: "alfresco-dockerfiles-bakery"
        owner: "Alfresco"
        url: "https://github.com/Alfresco/alfresco-dockerfiles-bakery"
        branch: "main"
        enabled: true

      - name: "alfresco-docker-base-tomcat"
        owner: "Alfresco"
        url: "https://github.com/Alfresco/alfresco-docker-base-tomcat"
        branch: "master"
        enabled: true

      - name: "alfresco-docker-base-java"
        owner: "Alfresco"
        url: "https://github.com/Alfresco/alfresco-docker-base-java"
        branch: "master"
        enabled: true

  - name: "Personal Projects"
    slug: "personal"
    description: "My personal development projects"
    enabled: true
    repositories:
      - name: "my-awesome-project"
        owner: "myusername"
        url: "https://github.com/myusername/my-awesome-project"
        branch: "develop"
        enabled: false

# GitHub API settings
github:
  # API base URL (for GitHub Enterprise, change this)
  api_url: "https://api.github.com"

# Dashboard settings
dashboard:
  # Dashboard title displayed on the main page
  title: "Alfresco repositories monitoring"

  # Auto-refresh interval in seconds
  refresh_interval: 300

  # Maximum number of workflow runs to fetch per repository (deduplicates to latest per workflow)
  max_runs_to_fetch: 20

  # Show only specific workflow statuses (success, failure, in_progress, cancelled)
  show_statuses: ["success", "failure", "in_progress"]
